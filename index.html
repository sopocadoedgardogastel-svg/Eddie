<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ed's Closet</title>

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

header{
    background:#222;
    color:white;
    padding:20px;
    text-align:center;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.card{
    background:white;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}

.price{
    color:#e91e63;
    font-size:22px;
    font-weight:bold;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#e91e63;
    color:white;
    cursor:pointer;
    border-radius:8px;
    margin-top:10px;
}

footer{
    text-align:center;
    padding:20px;
    background:#222;
    color:white;
}
</style>
</head>

<body>

<header>
    <h1>🛍️ Ed's Closet</h1>
    <p>Preloved Clothes, Shoes & More</p>
</header>

<section class="products">

    <div class="card">
        <img srcvia.placeholder.com/400x300
        <div class="card-content">
            <h3>Black Jacket</h3>
            <p>Size M • Excellent Condition</p>
            <div class="price">150 DKK</div>
            <button onclick="contactSeller()">
                Interested
            </button>
        </div>
    </div>

    <div class="card">
        <imgs://via.placeholder.com/400x300
        <div class="card-content">
            <h3>Nike Shoes</h3>
            <p>Size 42 • Good Condition</p>
            <div class="price">250 DKK</div>
            <button onclick="contactSeller()">
                Interested
            </button>
        </div>
    </div>

    <div class="card">
        https://via.placeholder.com/400x300
        <div class="card-content">
            <h3>Gaming Headphones</h3>
            <p>Used but working perfectly</p>
            <div class="price">100 DKK</div>
            <button onclick="contactSeller()">
                Interested
            </button>
        </div>
    </div>

</section>

<footer>
    Contact me on Facebook Marketplace, Messenger, or SMS
</footer>

<script>
function contactSeller(){
    alert("Contact Ed to purchase this item 😊");
}
</script>

</body>
</html>
